name: cloud_firestore_odm_example
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.0.0
  cloud_firestore_odm: ^2.0.3
  firebase_core: ^4.0.0
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  meta: ^1.12.0

dev_dependencies:
  build_runner: ^2.8.0
  cloud_firestore_odm_generator:
    path: ../../cloud_firestore_odm_generator
  cloud_firestore_odm_generator_integration_test:
    path: ../../cloud_firestore_odm_generator/cloud_firestore_odm_generator_integration_test
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  http: ^1.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.0
  mockito: ^5.0.0

dependency_overrides:
  cloud_firestore_odm:
    path: ../
  flutter_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/flutter_riverpod
  hooks_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/hooks_riverpod
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_analyzer_utils
  riverpod_annotation:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_annotation
  riverpod_generator:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_generator
  riverpod_sqflite:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_sqflite
  test_api: ^0.7.7

flutter:
  uses-material-design: true
