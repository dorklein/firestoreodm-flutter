name: cloud_firestore_odm_generator_integration_test
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  cloud_firestore: ^6.0.0
  cloud_firestore_odm: ^2.0.3
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  meta: ^1.12.0
  riverpod_annotation: 4.0.2

dev_dependencies:
  build_runner: ^2.8.0
  cloud_firestore_odm_generator:
    path: ../
  firebase_core_platform_interface: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  riverpod_generator: 4.0.3
  test: ^1.26.3

dependency_overrides:
  cloud_firestore_odm:
    path: ../../cloud_firestore_odm
  flutter_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/flutter_riverpod
  hooks_riverpod:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/hooks_riverpod
  riverpod_analyzer_utils:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_analyzer_utils
  riverpod_annotation:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_annotation
  riverpod_generator:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_generator
  riverpod_sqflite:
    git:
      url: https://github.com/rrousselGit/riverpod.git
      ref: analyzer10
      path: packages/riverpod_sqflite
  test_api: ^0.7.7

flutter:
  uses-material-design: false
